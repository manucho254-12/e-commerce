{% extends "base.html" %}{% block content %}<h2>My Orders</h2><div class="scroll"><table><tr><th>#</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr>
{% for o in orders %}<tr><td>{{ o.id }}</td><td>{{ o.created_at }}</td><td>KES {{ '%.2f'|format(o.total) }}</td><td><span class="badge {{ o.status }}">{{ o.status.replace('_',' ') }}</span></td>
<td><a href="{{ url_for('order_detail', oid=o.id) }}">View</a></td></tr>{% else %}<tr><td colspan="5">No orders yet.</td></tr>{% endfor %}</table></div>{% endblock %}
