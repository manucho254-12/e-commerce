{% extends "base.html" %}{% block content %}
<form method="get" action="{{ url_for('shop') }}" class="row"><input name="q" value="{{ s }}" placeholder="Search products..." style="flex:1"><button class="btn">Search</button></form>
<div class="grid">{% for p in products %}<div class="card">
<a href="{{ url_for('product', pid=p.id) }}">{% if p.image %}<img src="{{ url_for('static', filename='uploads/' + p.image) }}">{% else %}<img alt="">{% endif %}<h3>{{ p.name }}</h3></a>
<p class="price">KES {{ '%.2f'|format(p.price) }}</p>
{% if p.stock > 0 %}<form method="post" action="{{ url_for('cart_add', pid=p.id) }}"><button class="btn sm">Add to cart</button></form>{% else %}<span class="badge rejected">Out of stock</span>{% endif %}
</div>{% else %}<p>No products yet.</p>{% endfor %}</div>{% endblock %}
